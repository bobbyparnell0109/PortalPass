name: Deploy to GitHub Pages

# Builds the app and pushes it to the gh-pages branch, which GitHub Pages
# serves at https://bobbyparnell0109.github.io/PortalPass/

on:
  push:
    branches:
      - main
      - claude/portalpass-platform-ftxeog
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PORTALPASS_BASE: /PortalPass/
      # SPA fallback so deep links like /app/timetable resolve on Pages
      - run: cp dist/index.html dist/404.html
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
